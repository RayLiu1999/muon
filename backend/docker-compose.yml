services:
  muon-backend:
    build: .
    image: muon-backend:latest
    ports:
      - "${HOST_IP:-127.0.0.1}:${PORT:-8000}:8000"
    restart: unless-stopped
    # 如果遇到 YouTube 機器人阻擋 (Sign in to confirm you’re not a bot)，
    # 請將瀏覽器的 cookies 匯出為 cookies.txt 放在本目錄下，並取消下方兩行的註解：
    volumes:
      - ${COOKIES_PATH:-./cookies.txt}:/app/cookies.txt:ro
