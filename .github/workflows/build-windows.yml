name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（例如 v0.2.2）'
        required: true
        default: 'v0.2.2'

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          flutter build windows --release `
            --dart-define=API_KEY=$env:PROD_API_KEY `
            --dart-define=API_URL=$env:PROD_API_URL

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Package as ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $src = "build\windows\x64\runner\Release"
          $dst = "build\Muon-$version-Windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst
          echo "ZIP created: $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muon-${{ steps.version.outputs.tag }}-Windows
          path: build/Muon-${{ steps.version.outputs.tag }}-Windows.zip
          retention-days: 1
